version: "3.7"

networks:
  imgproxy-url-builder-network:
    name: imgproxy-url-builder-network
    driver: bridge

volumes:
  imgproxy-url-builder-silo__data:
    driver: local

services:
  application:
    container_name: imgproxy-url-builder
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Use the default non-root user 1000
        # On MacOS: Add the line export UID="$(id -u $(whoami))" to your .zshrc
        USER_UID: "${UID:-1000}"
        USER_GID: "${UID:-1000}"
    networks:
      - imgproxy-url-builder-network
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    user: node
    env_file:
      - ./workspace.env
    ports:
      - 4000:4000
      - 4001:4001
      - 4002:4002
      - 9000:9000
      - 9001:9001

  # Silo
  imgproxy-url-builder-silo:
    container_name: imgproxy-url-builder-silo
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    network_mode: service:application
    volumes:
      - type: volume
        source: imgproxy-url-builder-silo__data
        target: /data
        volume:
          nocopy: false
    command: server /data --console-address :9001
    env_file:
      - ./silo.env

  # Imgproxy
  imgproxy-url-builder-imgproxy:
    container_name: imgproxy-url-builder-imgproxy
    image: darthsim/imgproxy:v3.13.2
    network_mode: service:application
    env_file:
      - ./imgproxy.env

  imgproxy-url-builder-imgproxy-unsigned:
    container_name: imgproxy-url-builder-imgproxy-unsigned
    image: darthsim/imgproxy:v3.13.2
    network_mode: service:application
    env_file:
      - ./imgproxy-unsigned.env

  imgproxy-url-builder-imgproxy-ttruncated:
    container_name: imgproxy-url-builder-imgproxy-truncated
    image: darthsim/imgproxy:v3.13.2
    network_mode: service:application
    env_file:
      - ./imgproxy-truncated.env
