name: Build

on: push

jobs:
  build:
    if: github.repository_owner == 'bitpatty'
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
      - run: npm install
      - run: npm run build
      - run: npm run lint
      - run: npm run test
      - name: Coveralls
        uses: coverallsapp/github-action@v1
